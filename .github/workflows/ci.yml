name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install wasm-bindgen
        run: |
          version=$(grep -A1 'name = "wasm-bindgen"$' engine/Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked

      - run: npm ci

      - name: Engine tests
        run: cargo test --release --manifest-path engine/Cargo.toml

      - name: Translations
        run: node scripts/i18n-check.mjs

      - name: Build site
        run: node scripts/build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7
